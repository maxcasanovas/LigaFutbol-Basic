<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LigaFutbol | País</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">Liga<span>Futbol</span></div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="ligas.html">Ligas</a></li>
        <li><a href="paises.html" class="active">Países</a></li>
        <li><a href="ciudades.html">Ciudades</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div>
      <h1 class="page-title" id="form-title">Nuevo país</h1>
      <p class="page-subtitle">Completá el nombre del país.</p>
    </div>

    <section class="form-card">
      <form id="pais-form" class="form-grid" novalidate>
        <label class="form-field">
          <span>Nombre del país</span>
          <input type="text" name="name" placeholder="Ej: Uruguay" required />
        </label>

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-actions">
          <a href="paises.html" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 LigaFutbol. Proyecto educativo sin fines comerciales.</p>
  </footer>

  <script src="js/data.js"></script>
