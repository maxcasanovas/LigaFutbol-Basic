<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LigaFutbol | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Liga<span>Futbol</span></a>
  </header>

  <main class="login-main">
    <section class="login-card">
      <h1 class="page-title">Iniciar sesión</h1>
      <p class="page-subtitle">Ingresá tus datos para acceder al panel de LigaFutbol.</p>

      <form id="login-form" class="login-form" novalidate>
        <label class="login-field">
          <span>Correo electrónico</span>
          <input type="email" name="email" placeholder="tu@correo.com" required />
        </label>

        <label class="login-field">
          <span>Contraseña</span>
          <input type="password" name="password" placeholder="••••••••" required minlength="6" />
        </label>

        <p class="login-error" id="login-error" hidden>Completá ambos campos para continuar.</p>

        <button type="submit" class="login-submit">Ingresar</button>
      </form>

      <p class="login-hint">¿Solo querés mirar? <a href="index.html">Entrá al Dashboard</a>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 LigaFutbol. Proyecto educativo sin fines comerciales.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
