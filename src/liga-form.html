<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LigaFutbol | Liga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">Liga<span>Futbol</span></div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="ligas.html" class="active">Ligas</a></li>
        <li><a href="paises.html">Países</a></li>
        <li><a href="ciudades.html">Ciudades</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div>
      <h1 class="page-title" id="form-title">Nueva liga</h1>
      <p class="page-subtitle">Completá el nombre y el país de la liga.</p>
    </div>

    <section class="form-card">
      <form id="liga-form" class="form-grid" novalidate>
        <label class="form-field">
          <span>Nombre de la liga</span>
          <input type="text" name="name" placeholder="Ej: Eredivisie" required />
        </label>

        <label class="form-field">
          <span>País</span>
          <select name="country" required></select>
        </label>

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-actions">
          <a href="ligas.html" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </section>

    <section id="league-teams-section" hidden>
      <div class="section-header">
        <h2 class="page-title">Equipos de esta liga</h2>
        <a href="equipo-form.html" class="btn btn-primary" id="add-team-link">+ Agregar equipo</a>
      </div>
      <div class="teams-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Equipo</th>
              <th>Ciudad</th>
              <th>Fundado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="league-teams-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 LigaFutbol. Proyecto educativo sin fines comerciales.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/liga-form.js"></script>
</body>
</html>
